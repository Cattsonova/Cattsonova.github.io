    encodeURIComponent('utm_source=' + k + '&utm_medium=bio&utm_campaign=indir');
  var ios = 'https://apps.apple.com/app/id6822886805';
  var iPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  window.ZJ_LINKS = { play: play, ios: ios };
  if (/iPhone|iPad|iPod/.test(ua) || iPadOS) location.replace(ios);
  else if (/Android/i.test(ua)) location.replace(play);
})();
